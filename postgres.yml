apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-storage
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: admin123
  REPLICATION_USER: replicator
  REPLICATION_PASSWORD: replica123

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres

spec:
  serviceName: postgres-headless
  replicas: 3

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      nodeSelector:
        kubernetes.io/hostname: minikube-m02

      containers:
        - name: postgres
          image: postgres:18

          command:
            - bash
            - /scripts/start.sh

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: REPLICATION_USER

            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: REPLICATION_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

            - name: postgres-scripts
              mountPath: /scripts
              readOnly: true

            - name: postgres-scripts
              mountPath: /docker-entrypoint-initdb.d/primary-setup.sh
              subPath: primary-setup.sh
              readOnly: true

      volumes:
        - name: postgres-scripts
          configMap:
            name: postgres-scripts
            defaultMode: 0755

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: postgres-storage
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
